track_high_thresh:
  type: uniform
  default: 0.5
  range: [0.3, 0.7]

track_low_thresh:
  type: uniform
  default: 0.1
  range: [0.05, 0.3]

new_track_thresh:
  type: uniform
  default: 0.5
  range: [0.5, 0.9]

track_buffer:
  type: qrandint
  default: 35
  range: [20, 80, 10]

match_thresh:
  type: uniform
  default: 0.65
  range: [0.1, 0.9]

second_match_thresh:
  type: uniform
  default: 0.19
  range: [0.1, 0.4]

overlap_thresh:
  type: uniform
  default: 0.55
  range: [0.3, 0.6]

proximity_thresh:
  type: uniform
  default: 0.1
  range: [0.1, 0.8]

appearance_thresh:
  type: uniform
  default: 0.25
  range: [0.1, 0.8]

cmc_method:
  type: choice
  default: sparseOptFlow
  options: ['sparseOptFlow']

frame_rate:
  type: choice
  default: 30
  options: [30]

lambda_:
  type: uniform
  default: 0.05
  range: [0.05, 0.3]
