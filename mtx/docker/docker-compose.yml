  # # Garden AI 服务 (独立进程)
  # ai-garden:
  #   build:
  #     context: ..
  #     dockerfile: python/garden/Dockerfile
  #   container_name: ai-garden
  #   environment:
  #     - GARDEN_ZMQ_ADDR=tcp://0.0.0.0:5557
  #   ipc: host
