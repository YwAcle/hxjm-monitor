# ============================================================
# AI 流媒体处理配置
# ============================================================
#
# 配置字段说明:
#
# mediamtx_url       - MediaMTX 推流服务器地址
#
# ai_tasks_ipc       - 各 AI 任务的全局 IPC 地址
#   <task_name>: <ipc_address>
#
# ai_config          - 全局 AI 配置 (可被任务级别覆盖)
#   frame_skip       - 每 N 帧处理一次 (1=每帧都处理)
#   ai_thread_num    - AI 处理线程数
#   queue_size       - 帧队列大小
#   zmq_timeout      - ZeroMQ 超时时间 (ms)
#
# streams            - 视频流配置列表
#   name             - 流名称 (用于生成推流地址)
#   rtsp_url         - RTSP 拉流地址
#   keep_original    - 是否保留原始流 (true/false)
#   enabled          - 是否启用该流 (true/false)
#   ai_tasks         - AI 任务列表
#     type           - 任务名称 (必填)
#     transport      - 传输模式: shm(共享内存,需渲染) / base64(发送后不回读)
#     ipc_addr       - IPC 地址 (覆盖全局)
#     frame_skip     - 覆盖全局 frame_skip
#     ai_thread_num  - 覆盖全局 ai_thread_num
#     queue_size     - 覆盖全局 queue_size
#     zmq_timeout    - 覆盖全局 zmq_timeout
#
# ============================================================

# Docker 环境使用
mediamtx_url: rtsp://mediamtx:8554/live

# 各 AI 任务的通信地址 (Docker 使用 TCP)
ai_tasks_ipc:
  reid: tcp://ai-reid:5556
  garden: tcp://ai-garden:5557
  sam3: tcp://ai-sam3:5558

# 全局 AI 配置（可被任务级别配置覆盖）
ai_config:
  frame_skip: 1
  ai_thread_num: 4
  queue_size: 25
  zmq_timeout: 5000

# 视频流配置
streams:
  - name: camera_1
    rtsp_url: rtsp://admin:hxjm2025@192.168.124.158:554/Streaming/Channels/101
    keep_original: true
    enabled: true
    ai_tasks:
#      - type: reid
#        transport: shm
#
#      - type: garden
#        transport: base64
      - type: sam3
        transport: shm
        frame_skip: 3
        ai_thread_num: 4
        queue_size: 10
        zmq_timeout: 120000

  - name: camera_2
    rtsp_url: rtsp://admin:hxjm2025@192.168.5.239:554/Streaming/Channels/101
    keep_original: false
    enabled: false  # 暂时禁用
    ai_tasks:
#      - type: reid
#        transport: shm
      - type: sam3
        transport: shm
        frame_skip: 5
        zmq_timeout: 120000
